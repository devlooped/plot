name: obsidian
# Releases the Obsidian plugin (packages/obsidian).
#
# Obsidian and BRAT install a plugin from the GitHub release whose tag is
# exactly the version of the manifest.json at the root of the repository (x.y.z,
# no "v"), and take main.js, manifest.json and styles.css from its assets. So in
# this repository a plain x.y.z tag is a release of the plugin, and nothing else
# uses that form (the action is v1; npm versions are not tagged).
#
# To release: `pnpm --filter plotdown-obsidian bump -- x.y.z`, commit, then push
# the tag x.y.z (or run this workflow by hand on the commit, giving the version).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release: the one of manifest.json (x.y.z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: 📦 pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙ node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 🔎 version
        run: |
          set -euo pipefail
          manifest=$(node -p 'require("./manifest.json").version')
          plugin=$(node -p 'require("./packages/obsidian/manifest.json").version')
          if [ "$VERSION" != "$manifest" ] || [ "$VERSION" != "$plugin" ]; then
            echo "::error::the release is $VERSION, but manifest.json says $manifest and packages/obsidian/manifest.json says $plugin: run the bump script and commit first"
            exit 1
          fi

      - name: 🔽 install
        run: pnpm install --frozen-lockfile

      - name: 🙏 build
        run: pnpm --filter plotdown-obsidian... build

      - name: 🧪 test
        run: pnpm --filter plotdown-obsidian test

      - name: 🚀 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packages/obsidian/dist
          notes="Plotdown for Obsidian $VERSION: renders \`plot\`, \`oplot\` and \`observable-plot\` code blocks as Observable Plot charts. Install it with BRAT (\`devlooped/plotdown\`), or copy \`main.js\`, \`manifest.json\` and \`styles.css\` into \`<vault>/.obsidian/plugins/plotdown/\`. See https://plotdown.cc/recipes/obsidian/."
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "Plotdown for Obsidian $VERSION" --notes "$notes" --verify-tag
          fi
          # The files are attached after the release exists, and checked: on the first
          # release of this repository (0.1.0), the files given to `gh release create`
          # were not on the release afterwards, and the step had not failed. The cause
          # is not known; the release showed the organization's bot as its author.
          for attempt in 1 2 3 4 5; do
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"
            sleep 15
            count=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "main.js" or .name == "manifest.json" or .name == "styles.css")] | length')
            if [ "$count" = "3" ]; then echo "The release $VERSION has its three files."; exit 0; fi
            echo "The release has $count of its 3 files after attempt $attempt; uploading again."
          done
          echo "::error::the release $VERSION does not keep main.js, manifest.json and styles.css"
          exit 1
